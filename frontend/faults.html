<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaultSense — Faults</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span class="logo-text">FaultSense</span></div>
    <nav class="sidebar-nav">
      <a href="../index.html"  class="nav-link"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
      <a href="sensors.html"  class="nav-link"><span class="nav-icon">📡</span><span class="nav-text">Sensors</span></a>
      <a href="faults.html"   class="nav-link active"><span class="nav-icon">⚠️</span><span class="nav-text">Faults</span></a>
      <a href="alerts.html"   class="nav-link"><span class="nav-icon">🔔</span><span class="nav-text">Alerts</span> <span class="badge" id="alert-badge">0</span></a>
      <a href="reports.html"  class="nav-link"><span class="nav-icon">📊</span><span class="nav-text">Reports</span></a>
      <a href="settings.html" class="nav-link"><span class="nav-icon">⚙️</span><span class="nav-text">Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="user-avatar">U</div>
        <div><div class="user-name" id="user-name">User</div><div class="user-role" id="user-role">operator</div></div>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Faults</h1>
      <div class="topbar-right">
        <button class="btn-sm" onclick="exportFaults()">⬇ Export CSV</button>
      </div>
    </header>

    <!-- Filters -->
    <div class="filter-bar">
      <select id="filter-severity" onchange="loadFaults()">
        <option value="">All Severities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="filter-status" onchange="loadFaults()">
        <option value="">All Status</option>
        <option value="open">Open</option>
        <option value="resolved">Resolved</option>
      </select>
      <input type="text" id="filter-search" placeholder="Search faults…" oninput="filterTable()" />
      <button class="btn-sm" onclick="loadFaults()">↻ Refresh</button>
    </div>

    <!-- Faults Table -->
    <section class="section-card">
      <div class="table-wrapper">
        <table class="data-table" id="faults-table">
          <thead>
            <tr>
              <th onclick="sortTable(0)">ID ↕</th>
              <th onclick="sortTable(1)">Sensor ↕</th>
              <th onclick="sortTable(2)">Severity ↕</th>
              <th>Type</th>
              <th>Value</th>
              <th>Description</th>
              <th onclick="sortTable(6)">Detected ↕</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="faults-tbody">
            <tr><td colspan="9" class="loading-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/faults.js"></script>
</body>
</html>
