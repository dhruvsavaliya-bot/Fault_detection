<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaultSense — Reset password</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .auth-container { grid-template-columns: 1fr; max-width: 440px; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2 20 7v10l-8 5-8-5V7z"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></div>
        <h1>Reset password</h1>
        <p>Choose a new password for your account.</p>
      </div>

      <div class="auth-notice hidden" id="invalid-notice">
        This reset link is invalid or has expired. Request a new one from the sign-in page.
      </div>

      <form id="reset-form" class="auth-form" onsubmit="handleReset(event)">
        <div class="form-group">
          <label>New password</label>
          <input type="password" id="new-password" placeholder="Minimum 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter password" required minlength="6" />
        </div>
        <button type="submit" class="btn-auth" id="reset-btn">Reset password</button>
        <div class="auth-error" id="reset-error"></div>
      </form>

      <div class="auth-demo-hint">
        <a href="login.html" class="auth-link">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      document.getElementById("reset-form").classList.add("hidden");
      document.getElementById("invalid-notice").classList.remove("hidden");
      document.getElementById("invalid-notice").classList.add("error");
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById("reset-btn");
      const errEl = document.getElementById("reset-error");
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      errEl.textContent = "";
      if (newPassword !== confirmPassword) {
        errEl.textContent = "Passwords do not match";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting…";
      try {
        await AuthAPI.resetPassword(token, newPassword);
        window.location.href = "login.html?verify=reset";
      } catch (err) {
        errEl.textContent = err.message || "Something went wrong";
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    }
  </script>
</body>
</html>
