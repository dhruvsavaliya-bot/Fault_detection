<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaultSense — Sensors</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span class="logo-text">FaultSense</span></div>
    <nav class="sidebar-nav">
      <a href="../index.html"  class="nav-link"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
      <a href="sensors.html"  class="nav-link active"><span class="nav-icon">📡</span><span class="nav-text">Sensors</span></a>
      <a href="faults.html"   class="nav-link"><span class="nav-icon">⚠️</span><span class="nav-text">Faults</span></a>
      <a href="alerts.html"   class="nav-link"><span class="nav-icon">🔔</span><span class="nav-text">Alerts</span> <span class="badge" id="alert-badge">0</span></a>
      <a href="reports.html"  class="nav-link"><span class="nav-icon">📊</span><span class="nav-text">Reports</span></a>
      <a href="settings.html" class="nav-link"><span class="nav-icon">⚙️</span><span class="nav-text">Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="user-avatar">U</div>
        <div><div class="user-name" id="user-name">User</div><div class="user-role" id="user-role">operator</div></div>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Sensors</h1>
      <div class="topbar-right">
        <button class="btn-primary" onclick="openAddModal()">+ Add Sensor</button>
      </div>
    </header>

    <!-- Sensor Cards Grid -->
    <section class="sensors-grid" id="sensors-grid">
      <div class="loading-spinner">Loading sensors…</div>
    </section>

    <!-- Sensor Detail Modal -->
    <div class="modal-overlay hidden" id="detail-modal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-sensor-name">Sensor Detail</h2>
          <button onclick="closeModal('detail-modal')">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-kpis" id="modal-kpis"></div>
          <canvas id="sensor-chart" height="200"></canvas>
          <div class="reading-form">
            <h3>Submit Reading</h3>
            <div class="inline-form">
              <input type="number" id="reading-value" placeholder="Enter value" step="0.01" />
              <button class="btn-primary" onclick="submitReading()">Submit</button>
            </div>
            <div id="reading-result"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Sensor Modal -->
    <div class="modal-overlay hidden" id="add-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>Add New Sensor</h2>
          <button onclick="closeModal('add-modal')">✕</button>
        </div>
        <div class="modal-body">
          <form onsubmit="addSensor(event)">
            <div class="form-group"><label>Name</label>
              <input type="text" id="new-name" required placeholder="e.g. Motor Temp B" /></div>
            <div class="form-group"><label>Type</label>
              <select id="new-type">
                <option value="temperature">Temperature</option>
                <option value="vibration">Vibration</option>
                <option value="pressure">Pressure</option>
                <option value="current">Current</option>
                <option value="voltage">Voltage</option>
                <option value="humidity">Humidity</option>
              </select></div>
            <div class="form-group"><label>Location</label>
              <input type="text" id="new-location" placeholder="e.g. Zone A" /></div>
            <div class="form-group"><label>Unit</label>
              <input type="text" id="new-unit" placeholder="e.g. °C" /></div>
            <button type="submit" class="btn-primary">Add Sensor</button>
          </form>
        </div>
      </div>
    </div>

  </main>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/sensors.js"></script>
</body>
</html>
