<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaultSense — Reports</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span class="logo-text">FaultSense</span></div>
    <nav class="sidebar-nav">
      <a href="../index.html"  class="nav-link"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
      <a href="sensors.html"  class="nav-link"><span class="nav-icon">📡</span><span class="nav-text">Sensors</span></a>
      <a href="faults.html"   class="nav-link"><span class="nav-icon">⚠️</span><span class="nav-text">Faults</span></a>
      <a href="alerts.html"   class="nav-link"><span class="nav-icon">🔔</span><span class="nav-text">Alerts</span> <span class="badge" id="alert-badge">0</span></a>
      <a href="reports.html"  class="nav-link active"><span class="nav-icon">📊</span><span class="nav-text">Reports</span></a>
      <a href="settings.html" class="nav-link"><span class="nav-icon">⚙️</span><span class="nav-text">Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="user-avatar">U</div>
        <div><div class="user-name" id="user-name">User</div><div class="user-role" id="user-role">operator</div></div>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Reports & Analytics</h1>
      <div class="topbar-right">
        <select id="period-select" onchange="loadAnalytics()">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30">Last 30 days</option>
        </select>
      </div>
    </header>

    <!-- Summary KPIs -->
    <section class="kpi-grid" id="report-kpis">
      <div class="kpi-card"><div class="kpi-value" id="r-total">—</div><div class="kpi-label">Total Faults</div></div>
      <div class="kpi-card critical"><div class="kpi-value" id="r-critical">—</div><div class="kpi-label">Critical</div></div>
      <div class="kpi-card fault"><div class="kpi-value" id="r-high">—</div><div class="kpi-label">High</div></div>
      <div class="kpi-card"><div class="kpi-value" id="r-rate">—%</div><div class="kpi-label">Resolution Rate</div></div>
    </section>

    <!-- Charts -->
    <section class="charts-row">
      <div class="chart-card">
        <div class="chart-header"><h2>Fault Trend</h2></div>
        <div class="chart-body"><canvas id="report-trend-chart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-header"><h2>By Sensor</h2></div>
        <div class="chart-body"><canvas id="report-sensor-chart"></canvas></div>
      </div>
    </section>

    <!-- Severity Breakdown -->
    <section class="charts-row">
      <div class="chart-card">
        <div class="chart-header"><h2>Severity Distribution</h2></div>
        <div class="chart-body"><canvas id="report-severity-chart"></canvas></div>
      </div>
      <div class="chart-card export-panel">
        <div class="chart-header"><h2>Export Data</h2></div>
        <div class="chart-body">
          <div style="width:100%">
            <p>Download fault or sensor reading data as CSV.</p>
            <button class="btn-primary" onclick="exportFaultsCSV()">⬇ Faults CSV</button>
            <button class="btn-secondary" onclick="exportReadingsCSV()">⬇ Readings CSV</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
