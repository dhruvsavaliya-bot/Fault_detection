services:
  faultsense:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?set a real SECRET_KEY in .env}
      - JWT_SECRET=${JWT_SECRET:?set a real JWT_SECRET in .env}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///fault_detection.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - FLASK_DEBUG=false
    volumes:
      - faultsense-db:/app/backend/instance
      - faultsense-models:/app/backend/models

volumes:
  faultsense-db:
  faultsense-models:
